<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alyssa's Quinceañera</title>
  
  <link rel="preload" href="envelope.gif" as="image">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fcfcfc;
      overflow-x: hidden; 
    }

    #envelope-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('envelope.gif'); 
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50; 
    }

    #invitation-content {
      display: none; 
      width: 100%;
      max-width: 500px; 
      margin: 0 auto; 
      background-color: #fff;
      overflow: hidden; 
    }

    .invite-page {
      width: 100%;
      display: block; 
      margin: 0;
      padding: 0;
      border: none;
    }

    /* =========================================
       DESKTOP SETTINGS (Screens wider than 768px)
       ========================================= */
    @media (min-width: 769px) {
      .page-wrapper {
        position: relative;
        width: 100%; 
        left: 0; 
        display: block;
      }
      
      /* TickCounter - Desktop (Doubled Size) */
      #countdown-widget {
        position: absolute; 
        top: 25%; 
        left: 10%; 
        width: 80%; 
        height: 120px; 
        border: none; 
        background-color: transparent; 
        z-index: 10;
      }
    }

    /* =========================================
       MOBILE SETTINGS (Cell phones only)
       ========================================= */
    @media (max-width: 768px) {
      .page-wrapper {
        position: relative;
        width: 130%; 
        left: -15%;  
        display: block;
      }

      /* TickCounter - Mobile (Doubled Size, Zoom Adjusted) */
      #countdown-widget {
        position: absolute; 
        top: 24%; 
        left: 0%; 
        width: 100%; 
        height: 100px; 
        border: none; 
        background-color: transparent; 
        z-index: 10;
      }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="Quinceañera.m4a" loop preload="auto" autoplay></audio>

  <div id="envelope-screen">
    <div id="envelope-hitbox" 
         style="position: absolute; top: 30%; left: 10%; width: 80%; height: 40%; cursor: pointer; z-index: 60;">
    </div>
  </div>

  <div id="invitation-content">
    
    <div class="page-wrapper">
      <img src="page1.gif" class="invite-page" alt="Page 1">
      <a href="https://maps.app.goo.gl/1ujmyQ3dyE6RRyRf8" target="_blank" 
         style="position: absolute; top: 88%; left: 35%; width: 30%; height: 6%; display: block; z-index: 10;"></a>
    </div>

    <div class="page-wrapper">
      <img src="page2.gif" class="invite-page" alt="Page 2">
      <div id="page2-hitbox" 
           style="position: absolute; top: 0%; left: 0%; width: 100%; height: 100%; z-index: 10;">
      </div>
    </div>

    <div class="page-wrapper"><img src="page3.gif" class="invite-page" alt="Page 3"></div>
    
    <div class="page-wrapper">
      <img src="page4.gif" class="invite-page" alt="Page 4 - Countdown">
      <iframe id="countdown-widget" src="https://www.tickcounter.com/widget/countdown/10450526" scrolling="no"></iframe>
    </div>

    <div class="page-wrapper">
      <img src="page5.gif" class="invite-page" alt="Page 5">
      <a href="https://maps.app.goo.gl/1ujmyQ3dyE6RRyRf8" target="_blank" 
         style="position: absolute; top: 31%; left: 15%; width: 70%; height: 16%; display: block; z-index: 10;"></a>
    </div>

    <div class="page-wrapper">
      <img src="page6.gif" class="invite-page" alt="Page 6">
      <a href="https://www.amazon.com/registries/custom/placeholder" target="_blank" 
         style="position: absolute; top: 68%; left: 55%; width: 35%; height: 6%; display: block; z-index: 10;"></a>
    </div>

    <div class="page-wrapper">
      <img src="page7.gif" class="invite-page" alt="Page 7 - RSVP">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeLlFF9Fk8jGwnpqhVqs0fdYF7oQq307V00fA9B0taicaX1Bw/viewform" target="_blank" 
         style="position: absolute; top: 73%; left: 25%; width: 50%; height: 10%; display: block; z-index: 10;"></a>
    </div>
    
    <div class="page-wrapper">
      <img src="page8.gif" class="invite-page" alt="Page 8">
    </div>
  </div>

  <script>
    // Shared audio helper
    function attemptPlay() {
      let music = document.getElementById('bg-music');
      if (music.paused) {
        let playPromise = music.play();
        if (playPromise !== undefined) {
          playPromise.then(_ => {
            console.log("Audio playing successfully.");
          }).catch(error => {
            console.log("Audio blocked by device: ", error);
          });
        }
      }
    }

    // STRICT LISTENER 1: Envelope Hitbox
    document.getElementById('envelope-hitbox').addEventListener('click', function(event) {
      event.preventDefault(); 
      attemptPlay();
      document.getElementById('envelope-screen').style.display = 'none';
      document.getElementById('invitation-content').style.display = 'block';
    });

    // STRICT LISTENER 2: Page 2 Fallback
    document.getElementById('page2-hitbox').addEventListener('click', function(event) {
      attemptPlay();
      this.style.display = 'none'; // Hides itself after one tap so it doesn't block scrolling
    });
  </script>

</body>
</html>
