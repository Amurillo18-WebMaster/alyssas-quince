<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alyssa's Quinceañera</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fcfcfc;
    }

    /* The Envelope Overlay */
    #envelope-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('envelope.png'); 
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50; 
      cursor: pointer;
    }

    /* The pop-out animation - Enhanced bounce effect */
    @keyframes popOut {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.2); opacity: 1; } /* Increased from 1.1 for a bigger pop */
      100% { transform: scale(1); opacity: 1; }
    }

    /* The clickable image button - Doubled in size */
    #open-img-btn {
      width: 90%; /* Increased so it takes up more of a mobile screen */
      max-width: 600px; /* Doubled from 300px for larger screens */
      cursor: pointer;
      transition: transform 0.2s ease-in-out; 
      animation: popOut 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    #open-img-btn:hover {
      transform: scale(1.2); /* Increased hover pop-out size */
    }

    /* The vertically scrolling invitation */
    #invitation-content {
      display: none; 
      width: 100%;
      max-width: 500px; 
      margin: 0 auto; 
      background-color: #fff;
    }

    .invite-page {
      width: 100%;
      display: block; 
      margin: 0;
      padding: 0;
      border: none;
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="Quinceañera.mp3" loop></audio>

  <div id="envelope-screen" onclick="revealInvite()">
    <img src="Cordially2.png" id="open-img-btn" alt="You Are Cordially Invited">
  </div>

  <div id="invitation-content">
    <img src="page1.gif" class="invite-page" alt="Page 1">
    <img src="page2.gif" class="invite-page" alt="Page 2">
    <img src="page3.gif" class="invite-page" alt="Page 3">
    
    <div style="position: relative; width: 100%;">
      <img src="page4.gif" class="invite-page" alt="Page 4 - Countdown">
      
      <iframe src="https://www.tickcounter.com/widget/countdown/10450526" 
              style="position: absolute; 
                     top: 50%; 
                     left: 10%; 
                     width: 80%; 
                     height: 150px; 
                     border: none; 
                     background-color: transparent;
                     z-index: 10;" 
              scrolling="no">
      </iframe>
    </div>

    <img src="page5.gif" class="invite-page" alt="Page 5">
    <img src="page6.gif" class="invite-page" alt="Page 6">
    <img src="page7.gif" class="invite-page" alt="Page 7">
    
    <div style="position: relative; width: 100%;">
      <img src="page8.gif" class="invite-page" alt="Page 8 - RSVP">
      
      <a href="YOUR_GOOGLE_FORM_LINK_HERE" target="_blank" 
         style="position: absolute; 
                top: 75%; 
                left: 20%; 
                width: 60%; 
                height: 10%; 
                display: block; 
                z-index: 10;">
      </a>
    </div>
  </div>

  <script>
    function revealInvite() {
      // 1. Hide the envelope
      document.getElementById('envelope-screen').style.display = 'none';
      
      // 2. Show the scrolling images
      document.getElementById('invitation-content').style.display = 'block';
      
      // 3. Force the music to play
      let music = document.getElementById('bg-music');
      music.play().catch(function(error) {
        console.log("Audio blocked by browser:", error);
      });
    }
  </script>

</body>
</html>
