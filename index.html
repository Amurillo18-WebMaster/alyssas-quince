<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alyssa's Quinceañera</title>
  
  <link rel="preload" href="envelope.gif" as="image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fcfcfc;
      overflow-x: hidden; 
    }

    #envelope-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('envelope.gif'); 
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50; 
    }

    #invitation-content {
      display: none; 
      width: 100%;
      max-width: 500px; 
      margin: 0 auto; 
      background-color: #fff;
      overflow: hidden; 
    }

    .invite-page {
      width: 100%;
      display: block; 
      margin: 0;
      padding: 0;
      border: none;
    }

    .invisible-btn {
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.2s ease; /* Smoothly fades out instead of abruptly deleting */
    }

    /* =========================================
       GOLD GRADIENT TEXT CLASS
       ========================================= */
    .gold-gradient {
      /* Replicates the shiny metallic gold from "The Details" */
      background: linear-gradient(135deg, #a67c00 0%, #bf953f 25%, #fcf6ba 50%, #b38728 75%, #fdffcc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      /* We use filter instead of text-shadow for gradient text */
      filter: drop-shadow(1px 1px 1px rgba(255, 255, 255, 0.8));
    }

    /* =========================================
       CUSTOM COUNTDOWN WIDGET STYLES
       ========================================= */
    .countdown-title {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem; 
      font-weight: normal;
      margin: 0 0 5px 0;
      text-align: center;
    }

    .countdown-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #333; 
      background-color: transparent; 
      padding: 0px 10px;
      border-radius: 12px;
      box-shadow: none; 
      width: 100%;
      box-sizing: border-box;
    }

    .time-segment {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }

    .number {
      font-family: 'Great Vibes', cursive; /* Applied Great Vibes to numbers */
      font-size: 3rem; /* Increased because cursive numbers run small */
      font-weight: normal;
      line-height: 1;
      letter-spacing: 2px;
      color: #333;
    }

    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888; 
      margin-top: 2px;
    }

    .divider {
      font-size: 1.8rem;
      font-weight: 300;
      color: #ccc;
      margin: 0 8px;
      padding-bottom: 25px;
    }

    /* =========================================
       DESKTOP SETTINGS
       ========================================= */
    @media (min-width: 769px) {
      .page-wrapper {
        position: relative;
        width: 100%; 
        left: 0; 
        display: block;
      }
      
      #internal-countdown {
        position: absolute; 
        top: 20%; 
        left: 10%; 
        width: 80%; 
        height: 120px; 
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    }

    /* =========================================
       MOBILE SETTINGS
       ========================================= */
    @media (max-width: 768px) {
      .page-wrapper {
        position: relative;
        width: 130%; 
        left: -15%;  
        display: block;
      }

      #internal-countdown {
        position: absolute; 
        top: 24%; /* Moved down by 5% (was 19%) */
        left: 0%; 
        width: 100%; 
        height: 100px; 
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* Enlarged elements by ~20% */
      .countdown-title { font-size: 2.1rem; margin-bottom: 0px; } 
      .number { font-size: 2.2rem; } 
      .divider { font-size: 1.8rem; margin: 0 4px; padding-bottom: 20px; }
      .time-segment { min-width: 55px; } /* Widened to fit larger font */
      .label { font-size: 0.65rem; } 
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="Quinceañera.m4a" loop playsinline preload="auto"></audio>

  <div id="envelope-screen">
    <button id="envelope-hitbox" class="invisible-btn"
            style="position: absolute; top: 30%; left: 10%; width: 80%; height: 40%; z-index: 60;">
    </button>
  </div>

  <div id="invitation-content">
    
    <div class="page-wrapper">
      <img src="page1.gif" class="invite-page" alt="Page 1">
      <a href="https://maps.app.goo.gl/1ujmyQ3dyE6RRyRf8" target="_blank" 
         style="position: absolute; top: 88%; left: 35%; width: 30%; height: 6%; display: block; z-index: 10;"></a>
    </div>

    <div class="page-wrapper">
      <img src="page2.gif" class="invite-page" alt="Page 2">
      <button id="page2-hitbox" class="invisible-btn"
              style="position: absolute; top: 0%; left: 0%; width: 100%; height: 100%; z-index: 50; display: flex; justify-content: center; align-items: center; flex-direction: column;">
        <h2 class="countdown-title gold-gradient" style="margin: 0;">Tap to Play</h2>
      </button>
    </div>

    <div class="page-wrapper"><img src="page3.gif" class="invite-page" alt="Page 3"></div>
    
    <div class="page-wrapper">
      <img src="page4.gif" class="invite-page" alt="Page 4 - Countdown">
      
      <div id="internal-countdown">
        <h2 class="countdown-title gold-gradient">Alyssa's Quinceañera</h2>
        <div class="countdown-wrapper">
          <div class="time-segment"><span id="days" class="number">00</span><span class="label">Days</span></div>
          <div class="divider">:</div>
          <div class="time-segment"><span id="hours" class="number">00</span><span class="label">Hours</span></div>
          <div class="divider">:</div>
          <div class="time-segment"><span id="minutes" class="number">00</span><span class="label">Minutes</span></div>
          <div class="divider">:</div>
          <div class="time-segment"><span id="seconds" class="number">00</span><span class="label">Seconds</span></div>
        </div>
      </div>
    </div>

    <div class="page-wrapper">
      <img src="page5.gif" class="invite-page" alt="Page 5">
      <a href="https://maps.app.goo.gl/1ujmyQ3dyE6RRyRf8" target="_blank" 
         style="position: absolute; top: 31%; left: 15%; width: 70%; height: 16%; display: block; z-index: 10;"></a>
    </div>

    <div class="page-wrapper">
      <img src="page6.gif" class="invite-page" alt="Page 6">
      <a href="https://www.amazon.com/registries/custom/placeholder" target="_blank" 
         style="position: absolute; top: 68%; left: 55%; width: 35%; height: 6%; display: block; z-index: 10;"></a>
    </div>

    <div class="page-wrapper">
      <img src="page7.gif" class="invite-page" alt="Page 7 - RSVP">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeLlFF9Fk8jGwnpqhVqs0fdYF7oQq307V00fA9B0taicaX1Bw/viewform" target="_blank" 
         style="position: absolute; top: 73%; left: 25%; width: 50%; height: 10%; display: block; z-index: 10;"></a>
    </div>
    
    <div class="page-wrapper">
      <img src="page8.gif" class="invite-page" alt="Page 8">
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      
      // =========================================
      // AUDIO & TRANSITION ENGINE
      // =========================================
      var music = document.getElementById('bg-music');
      var envScreen = document.getElementById('envelope-screen');
      var inviteContent = document.getElementById('invitation-content');
      var envBtn = document.getElementById('envelope-hitbox');
      var p2Btn = document.getElementById('page2-hitbox');

      // 1. Envelope Tap
      if (envBtn) {
        envBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (envScreen) envScreen.style.display = 'none';
          if (inviteContent) inviteContent.style.display = 'block';
          
          if (music && music.paused) {
            music.play().catch(function(err) { console.log("Audio blocked: ", err); });
          }
        });
      }

      // 2. Page 2 "Tap to Play" Fallback (Fixed to guarantee audio launch)
      if (p2Btn) {
        p2Btn.addEventListener('click', function(e) {
          e.preventDefault();
          
          // Instead of "display: none", we make it transparent and unclickable. 
          // This stops the browser from cancelling the audio request mid-process!
          this.style.opacity = '0';
          this.style.pointerEvents = 'none'; 
          
          if (music && music.paused) {
            music.play().catch(function(err) { console.log("Audio blocked: ", err); });
          }
        });
      }


      // =========================================
      // COUNTDOWN TIMER LOGIC
      // =========================================
      try {
        var targetDate = new Date("September 6, 2026 00:00:00").getTime();

        var countdownInterval = setInterval(function() {
          var now = new Date().getTime();
          var distance = targetDate - now;

          if (distance < 0) {
            clearInterval(countdownInterval);
            var countdownBox = document.getElementById("internal-countdown");
            if (countdownBox) {
              countdownBox.innerHTML = "<h2 class='countdown-title gold-gradient'>The Event is Here!</h2>";
            }
            return;
          }

          var elDays = document.getElementById("days");
          var elHours = document.getElementById("hours");
          var elMins = document.getElementById("minutes");
          var elSecs = document.getElementById("seconds");

          if (elDays && elHours && elMins && elSecs) {
            elDays.innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            elHours.innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            elMins.innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            elSecs.innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
          }
        }, 1000);
      } catch(err) {
        console.log("Countdown timer error: ", err);
      }

    });
  </script>

</body>
</html>
