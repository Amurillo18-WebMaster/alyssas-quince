<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alyssa's Quinceañera</title>
  
  <link rel="preload" href="envelope.gif" as="image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fcfcfc;
      overflow-x: hidden; 
    }

    #envelope-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('envelope.gif'); 
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50; 
    }

    #invitation-content {
      display: none; 
      width: 100%;
      max-width: 500px; 
      margin: 0 auto; 
      background-color: #fff;
      overflow: hidden; 
    }

    .invite-page {
      width: 100%;
      display: block; 
      margin: 0;
      padding: 0;
      border: none;
    }

    /* Invisible Button Reset CSS to make actual buttons completely invisible */
    .invisible-btn {
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================
       CUSTOM COUNTDOWN WIDGET STYLES
       ========================================= */
    .countdown-title {
      font-family: 'Great Vibes', cursive;
      color: #333; 
      font-size: 2.4rem; 
      font-weight: normal;
      margin: 0 0 5px 0;
      text-align: center;
    }

    .countdown-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #333; 
      background-color: transparent; 
      padding: 0px 10px;
      border-radius: 12px;
      box-shadow: none; 
      width: 100%;
      box-sizing: border-box;
    }

    .time-segment {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }

    .number {
      font-size: 2.2rem;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 1px;
    }

    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888; 
      margin-top: 6px;
    }

    .divider {
      font-size: 1.8rem;
      font-weight: 300;
      color: #ccc;
      margin: 0 8px;
      padding-bottom: 15px;
    }

    /* =========================================
       DESKTOP SETTINGS
       ========================================= */
    @media (min-width: 769px) {
      .page-wrapper {
        position: relative;
        width: 100%; 
        left: 0; 
        display: block;
      }
      
      #internal-countdown {
        position: absolute; 
        top: 25%; 
        left: 10%; 
        width: 80%; 
        height: 120px; 
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    }

    /* =========================================
       MOBILE SETTINGS
       ========================================= */
    @media (max-width: 768px) {
      .page-wrapper {
        position: relative;
        width: 130%; 
        left: -15%;  
        display: block;
      }

      #internal-countdown {
        position: absolute; 
        top: 24%; 
        left: 0%; 
        width: 100%; 
        height: 100px; 
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .countdown-title { font-size: 1.75rem; margin-bottom: 0px; } 
      .number { font-size: 1.6rem; }
      .divider { font-size: 1.4rem; margin: 0 4px; padding-bottom: 10px; }
      .time-segment { min-width: 45px; }
      .label { font-size: 0.55rem; }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="Quinceañera.m4a" loop playsinline preload="auto"></audio>

  <div id="envelope-screen">
    <button id="envelope-hitbox" class="invisible-btn"
            style="position: absolute; top: 30%; left: 10%; width: 80%; height: 40%; z-index: 60;">
    </button>
  </div>

  <div id="invitation-content">
    
    <div class="page-wrapper">
      <img src="page1.gif" class="invite-page" alt="Page 1">
      <a href="https://maps.app.goo.gl/1ujmyQ3dyE6RRyRf8" target="_blank" 
         style="position: absolute; top: 88%; left: 35%; width: 30%; height: 6%; display: block; z-index: 10;"></a>
    </div>

    <div class="page-wrapper">
      <img src="page2.gif" class="invite-page" alt="Page 2">
      <button id="page2-hitbox" class="invisible-btn"
              style="position: absolute; top: 0%; left: 0%; width: 100%; height: 100%; z-index: 50;">
      </button>
    </div>

    <div class="page-wrapper"><img src="page3.gif" class="invite-page" alt="Page 3"></div>
    
    <div class="page-wrapper">
      <img src="page4.gif" class="invite-page" alt="Page 4 - Countdown">
      
      <div id="internal-countdown">
        <h2 class="countdown-title">Alyssa's Quinceañera</h2>
        <div class="countdown-wrapper">
          <div class="time-segment"><span id="days" class="number">00</span><span class="label">Days</span></div>
          <div class="divider">:</div>
          <div class="time-segment"><span id="hours" class="number">00</span><span class="label">Hours</span></div>
          <div class="divider">:</div>
          <div class="time-segment"><span id="minutes" class="number">00</span><span class="label">Minutes</span></div>
          <div class="divider">:</div>
          <div class="time-segment"><span id="seconds" class="number">00</span><span class="label">Seconds</span></div>
        </div>
      </div>
    </div>

    <div class="page-wrapper">
      <img src="page5.gif" class="invite-page" alt="Page 5">
      <a href="https://maps.app.goo.gl/1ujmyQ3dyE6RRyRf8" target="_blank" 
         style="position: absolute; top: 31%; left: 15%; width: 70%; height: 16%; display: block; z-index: 10;"></a>
    </div>

    <div class="page-wrapper">
      <img src="page6.gif" class="invite-page" alt="Page 6">
      <a href="https://www.amazon.com/registries/custom/placeholder" target="_blank" 
         style="position: absolute; top: 68%; left: 55%; width: 35%; height: 6%; display: block; z-index: 10;"></a>
    </div>

    <div class="page-wrapper">
      <img src="page7.gif" class="invite-page" alt="Page 7 - RSVP">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeLlFF9Fk8jGwnpqhVqs0fdYF7oQq307V00fA9B0taicaX1Bw/viewform" target="_blank" 
         style="position: absolute; top: 73%; left: 25%; width: 50%; height: 10%; display: block; z-index: 10;"></a>
    </div>
    
    <div class="page-wrapper">
      <img src="page8.gif" class="invite-page" alt="Page 8">
    </div>
  </div>

  <script>
    // Wait for the entire website to finish loading before attaching buttons
    document.addEventListener("DOMContentLoaded", function() {
      
      // =========================================
      // AUDIO & TRANSITION ENGINE
      // =========================================
      var music = document.getElementById('bg-music');
      var envScreen = document.getElementById('envelope-screen');
      var inviteContent = document.getElementById('invitation-content');
      var envBtn = document.getElementById('envelope-hitbox');
      var p2Btn = document.getElementById('page2-hitbox');

      function forceAudio() {
        if (music && music.paused) {
          var playPromise = music.play();
          if (playPromise !== undefined) {
            playPromise.catch(function(error) {
              console.log("Audio blocked: ", error);
            });
          }
        }
      }

      function revealInvitation(e) {
        if(e) e.preventDefault();
        if (envScreen) envScreen.style.display = 'none';
        if (inviteContent) inviteContent.style.display = 'block';
        forceAudio();
      }

      // Main Envelope Button (Listens for both clicks and mobile taps)
      if (envBtn) {
        envBtn.addEventListener('click', revealInvitation);
        envBtn.addEventListener('touchstart', revealInvitation, {passive: false});
      }

      // Page 2 Fallback Button
      function triggerP2Audio(e) {
        if(e) e.preventDefault();
        forceAudio();
        if (p2Btn) p2Btn.style.display = 'none'; // Deletes itself so you can scroll
      }

      if (p2Btn) {
        p2Btn.addEventListener('click', triggerP2Audio);
        p2Btn.addEventListener('touchstart', triggerP2Audio, {passive: false});
      }


      // =========================================
      // COUNTDOWN TIMER LOGIC (Isolated for safety)
      // =========================================
      try {
        var targetDate = new Date("September 6, 2026 00:00:00").getTime();

        var countdownInterval = setInterval(function() {
          var now = new Date().getTime();
          var distance = targetDate - now;

          if (distance < 0) {
            clearInterval(countdownInterval);
            var countdownBox = document.getElementById("internal-countdown");
            if (countdownBox) {
              countdownBox.innerHTML = "<h2 style='text-align: center; color: #333; font-family: \"Great Vibes\", cursive; background: transparent; padding: 20px; font-size: 2.4rem; font-weight: normal; margin: 0;'>The Event is Here!</h2>";
            }
            return;
          }

          var elDays = document.getElementById("days");
          var elHours = document.getElementById("hours");
          var elMins = document.getElementById("minutes");
          var elSecs = document.getElementById("seconds");

          if (elDays && elHours && elMins && elSecs) {
            elDays.innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            elHours.innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            elMins.innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            elSecs.innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
          }
        }, 1000);
      } catch(err) {
        console.log("Countdown timer error: ", err);
      }

    });
  </script>

</body>
</html>
