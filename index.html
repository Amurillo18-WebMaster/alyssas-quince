<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alyssa's Quinceañera</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fcfcfc; /* Match your envelope background */
    }

    /* The Envelope Overlay - Locks the screen */
    #envelope-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('envelope.png'); /* Your exported Canva image */
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50; 
      cursor: pointer;
    }

   /* The animation that creates the pop-out entrance effect */
    @keyframes popOut {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      70% {
        transform: scale(1.1); /* Bounces slightly larger than normal */
        opacity: 1;
      }
      100% {
        transform: scale(1); /* Settles to normal size */
        opacity: 1;
      }
    }

    /* The clickable image button on the envelope */
    #open-img-btn {
      width: 90%; 
      max-width: 500px; 
      cursor: pointer;
      /* Smooth transition for when a user hovers over it */
      transition: transform 0.2s ease-in-out; 
      /* Triggers the pop-out animation the moment the page loads */
      animation: popOut 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    #open-img-btn:hover {
      transform: scale(1.1); /* Makes it pop out a bit more when the mouse hovers over it */
    }
    /* The actual Canva Invitation */
    #invitation-frame {
      display: none; /* Hidden until clicked */
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="bg-music" src="Quinceañera.mp3" loop></audio>

  <!-- Envelope Overlay -->
  <div id="envelope-screen" onclick="revealInvite()">
    <img src="Cordially2.png" id="open-img-btn" alt="You Are Cordially Invited">
  </div>

  <!-- Scrollable Canva Embed -->
  <iframe id="invitation-frame" src="https://www.canva.com/design/DAHLFXj_EKU/BCwNGFJ1xgjgiVTNOKGqAw/view?embed"></iframe>

  <script>
    function revealInvite() {
      // 1. Hide the envelope overlay
      document.getElementById('envelope-screen').style.display = 'none';
      
      // 2. Show the Canva iframe (which allows natural scrolling and clickable links)
      document.getElementById('invitation-frame').style.display = 'block';
      
      // 3. Play the music (Browser allows this because the user just clicked)
      document.getElementById('bg-music').play();
    }
  </script>

</body>
</html>
