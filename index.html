<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alyssa's Quinceañera</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fcfcfc;
    }

    /* The Envelope Overlay */
    #envelope-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('envelope.png'); 
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50; 
      cursor: pointer;
    }

    /* The pop-out animation */
    @keyframes popOut {
      0% { transform: scale(0.5); opacity: 0; }
      90% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* The clickable image button */
    #open-img-btn {
      width: 90%; 
      max-width: 800px; 
      cursor: pointer;
      transition: transform 0.2s ease-in-out; 
      animation: popOut 0.8s cubic-bezier(0.35, 1.77, 0.64, 2.55) forwards;
    }

    #open-img-btn:hover {
      transform: scale(1.1); 
    }

    /* The vertically scrolling invitation */
    #invitation-content {
      display: none; /* Hidden until clicked */
      width: 100%;
      max-width: 500px; /* Keeps it looking like a phone screen on desktop */
      margin: 0 auto; /* Centers it on computer screens */
      background-color: #fff;
    }

    .invite-page {
      width: 100%;
      display: block;
      margin: 0;
      padding: 0;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Audio Element (Make sure your file is actually named song.mp3) -->
  <audio id="bg-music" src="Quinceañera.mp3" loop></audio>

  <!-- Envelope Overlay -->
  <div id="envelope-screen" onclick="revealInvite()">
    <img src="Cordially2.png" id="open-img-btn" alt="You Are Cordially Invited">
  </div>

  <!-- Vertically Stacked Invitation Images -->
  <div id="invitation-content">
    <img src="page1.png" class="invite-page" alt="Page 1">
    <img src="page2.png" class="invite-page" alt="Page 2">
    <img src="page3.png" class="invite-page" alt="Page 3">
    <img src="page4.png" class="invite-page" alt="Page 4">
    <img src="page5.png" class="invite-page" alt="Page 5">
    <img src="page6.png" class="invite-page" alt="Page 6">
    <img src="page7.png" class="invite-page" alt="Page 7">
    <img src="page8.png" class="invite-page" alt="Page 8">
  </div>

  <script>
    function revealInvite() {
      // 1. Hide the envelope
      document.getElementById('envelope-screen').style.display = 'none';
      
      // 2. Show the scrolling images
      document.getElementById('invitation-content').style.display = 'block';
      
      // 3. Force the music to play
      let music = document.getElementById('bg-music');
      music.play().catch(function(error) {
        console.log("Audio blocked by browser:", error);
      });
    }
  </script>

</body>
</html>
