<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alyssa's Quinceañera</title>
  
  <link rel="preload" href="envelope.gif" as="image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fcfcfc;
      overflow-x: hidden; 
    }

    #envelope-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('envelope.gif'); 
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50; 
    }

    #invitation-content {
      display: none; 
      width: 100%;
      max-width: 500px; 
      margin: 0 auto; 
      background-color: #fff;
      overflow: hidden; 
    }

    .invite-page {
      width: 100%;
      display: block; 
      margin: 0;
      padding: 0;
      border: none;
    }

    .invisible-btn {
      background: rgba(255, 255, 255, 0.01); 
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.3s ease; 
    }

    /* =========================================
       GOLD GRADIENT TEXT CLASS
       ========================================= */
    .gold-gradient {
      background: linear-gradient(to bottom, #e7aa51 0%, #e7aa51 50%, #702906 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(1px 1px 1px rgba(255, 255, 255, 0.4));
    }

    /* =========================================
       FLOATING MUSIC BUTTON
       ========================================= */
    #floating-music-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 94px; /* Widened to match the new 25% larger icon */
      height: 120px; 
      background: transparent; 
      border-radius: 0;
      box-shadow: none;
      z-index: 9999;
      cursor: pointer;
      display: none; 
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Increased by 25% (75px to 94px), lowered by 10%, and perfectly centered */
    #play-pause-img {
      position: absolute;
      top: 10%; 
      left: 50%;
      transform: translateX(-50%); /* Forces it to the dead-center horizontally */
      width: 94px;
      height: 94px;
      object-fit: contain; 
      z-index: 1;
      filter: drop-shadow(1px 2px 4px rgba(0, 0, 0, 0.5));
    }

    /* Fixed to completely erase compressed grey video backgrounds */
    #dancing-video {
      position: absolute;
      bottom: 0; 
      left: 50%;
      transform: translateX(-50%); /* Centers the dancer below the icon */
      width: 75px;
      height: 75px;
      object-fit: cover;
      background-color: transparent;
      mix-blend-mode: multiply; 
      -webkit-mix-blend-mode: multiply; /* Fix for Apple Devices */
      /* Contrast/Brightness forces off-white compression pixels to turn pure white so they disappear */
      filter: contrast(1.5) brightness(1.2) drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.5)); 
      z-index: 2; 
      pointer-events: none; 
    }
