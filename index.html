<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alyssa's Quinceañera</title>
  
  <link rel="preload" href="envelope.gif" as="image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fcfcfc;
      overflow-x: hidden; 
    }

    #envelope-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('envelope.gif'); 
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50; 
    }

    #invitation-content {
      display: none; 
      width: 100%;
      max-width: 500px; 
      margin: 0 auto; 
      background-color: #fff;
      overflow: hidden; 
    }

    .invite-page {
      width: 100%;
      display: block; 
      margin: 0;
      padding: 0;
      border: none;
    }

    /* Invisible Button Reset CSS */
    .invisible-btn {
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================
       CUSTOM COUNTDOWN WIDGET STYLES
       ========================================= */
    .countdown-title {
      font-family: 'Great Vibes', cursive;
      color: #333; /* Change to #fff if it is too dark against your background */
      font-size: 2.4rem; 
      font-weight: normal;
      margin: 0 0 5px 0;
      text-align: center;
    }

    .countdown-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #333; 
      background-color: transparent; 
      padding: 0px 10px;
      border-radius: 12px;
      box-shadow: none; 
      width: 100%;
      box-sizing: border-box;
    }

    .time-segment {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }

    .number {
      font-size: 2.2rem;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 1px;
    }

    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888; 
      margin-top: 6px;
    }

    .divider {
      font-size: 1.8rem;
      font-weight: 300;
      color: #ccc;
      margin: 0 8px;
      padding-bottom: 15px;
    }

    /* =========================================
       DESKTOP SETTINGS
       ========================================= */
    @media (min-width: 769px) {
      .page-wrapper {
        position: relative;
        width: 100%; 
        left: 0; 
        display: block;
      }
      
      #internal-countdown {
        position: absolute; 
        top: 25%; 
        left: 10%; 
        width: 80%; 
        height: 120px; 
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    }

    /* =========================================
       MOBILE SETTINGS
       ========================================= */
    @media (max-width: 768px) {
      .page-wrapper {
        position: relative;
        width: 130%; 
        left: -15%;  
        display: block;
      }

      #internal-countdown {
        position: absolute; 
        top: 24%; 
        left: 0%; 
        width: 100%; 
        height: 100px;
